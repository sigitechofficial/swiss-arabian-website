name: Deploy Azure Dev

on:
  push:
    branches:
      - infra/azure-dev-deployment
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-swissarabian-dev' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrswissarabiandev' }}
  AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER || 'acrswissarabiandev.azurecr.io' }}
  AZURE_CONTAINER_APPS_ENV: ${{ vars.AZURE_CONTAINER_APPS_ENV || 'cae-swissarabian-dev' }}
  DEV_API_BASE_URL: https://ca-swissarabian-backend-dev.greenbush-d5b07575.uaenorth.azurecontainerapps.io
  AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME || 'kv-swissarabian-dev' }}

jobs:
  deploy:
    # One build per brand from the same code (the brand is the only build
    # setting); each brand has its own image, container app and identity.
    name: Build and deploy ${{ matrix.brand }} website to Azure dev
    runs-on: ubuntu-latest
    environment: azure-dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: SWISS_ARABIAN
            image: commerce-website
            app: ca-swissarabian-website-dev
            identity: mi-swissarabian-website-dev
          - brand: SAPIL
            image: commerce-website-sapil
            app: ca-sapil-website-dev
            identity: mi-sapil-website-dev
    env:
      IMAGE_REPOSITORY: ${{ matrix.image }}
      AZURE_CONTAINER_APP_WEBSITE: ${{ matrix.app }}

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Secret safety check
        run: |
          set -euo pipefail
          echo "Checking tracked files for accidental secrets..."

          TRACKED_ENV=$(git ls-files -- '.env' '.env.local' '.env.production' '.env.development' '.env.*' 2>/dev/null || true)
          TRACKED_ENV=$(printf '%s\n' "${TRACKED_ENV}" | grep -vE '\.example$' || true)
          if [ -n "${TRACKED_ENV}" ]; then
            echo "ERROR: env files must not be git-tracked:"
            printf '%s\n' "${TRACKED_ENV}"
            exit 1
          fi

          echo "Secret safety check passed"

      - name: Compute image tag
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="dev-${SHORT_SHA}"
          IMAGE="${{ env.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Docker image
        run: |
          # No environment in the image (deployment plan W4): only the brand,
          # product switches and the commit. Environment settings are set on the
          # container below.
          docker build \
            --build-arg "NEXT_PUBLIC_STOREFRONT_BRAND_CODE=${{ matrix.brand }}" \
            --build-arg NEXT_PUBLIC_ENABLE_MFA=false \
            --build-arg NEXT_PUBLIC_ENABLE_PASSWORD_RESET=true \
            --build-arg NEXT_PUBLIC_CUSTOMER_VERIFICATION_UI=true \
            --build-arg "NEXT_DEPLOYMENT_ID=${{ github.sha }}" \
            -t "${{ steps.vars.outputs.image }}" \
            .

      - name: Login to ACR
        run: |
          az acr login --name "${{ env.AZURE_ACR_NAME }}"

      - name: Push Docker image
        run: |
          docker push "${{ steps.vars.outputs.image }}"

      - name: Ensure Container App exists
        run: |
          set -euo pipefail
          APP="${{ env.AZURE_CONTAINER_APP_WEBSITE }}"
          RG="${{ env.AZURE_RESOURCE_GROUP }}"
          CAE="${{ env.AZURE_CONTAINER_APPS_ENV }}"
          IMAGE="${{ steps.vars.outputs.image }}"
          MI_NAME="${{ matrix.identity }}"

          if ! az identity show --name "$MI_NAME" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Creating user-assigned identity: ${MI_NAME}"
            az identity create --name "$MI_NAME" --resource-group "$RG" --location uaenorth >/dev/null
            PRINCIPAL_ID=$(az identity show --name "$MI_NAME" --resource-group "$RG" --query principalId -o tsv)
            ACR_ID=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query id -o tsv)
            az role assignment create --assignee-object-id "$PRINCIPAL_ID" --assignee-principal-type ServicePrincipal \
              --role AcrPull --scope "$ACR_ID" >/dev/null || true
            sleep 20
          fi

          MI_ID=$(az identity show --name "$MI_NAME" --resource-group "$RG" --query id -o tsv)

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Container App already exists: ${APP}"
            exit 0
          fi

          echo "Creating Container App: ${APP}"
          az containerapp create \
            --name "$APP" \
            --resource-group "$RG" \
            --environment "$CAE" \
            --image "$IMAGE" \
            --target-port 3000 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 2 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --registry-server "${{ env.AZURE_ACR_LOGIN_SERVER }}" \
            --user-assigned "$MI_ID" \
            --registry-identity "$MI_ID"

      - name: Update Container App image and env
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.vars.outputs.image }}" \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 2 \
            --set-env-vars \
              "NODE_ENV=production" \
              "PORT=3000" \
              "HOSTNAME=0.0.0.0" \
              "APP_ENV=dev" \
              "API_BASE_URL=${{ env.DEV_API_BASE_URL }}" \
              "SEO_INDEXING_ENABLED=false" \
              "GIT_COMMIT_SHA=${{ github.sha }}" \
              "GIT_SHORT_SHA=${{ steps.vars.outputs.short_sha }}" \
              "GIT_BRANCH=${{ github.ref_name }}" \
              "IMAGE_TAG=${{ steps.vars.outputs.image_tag }}" \
              "FULL_IMAGE=${{ steps.vars.outputs.image }}" \
              "BUILD_TIME=${{ steps.vars.outputs.build_time }}" \
              "GITHUB_RUN_URL=${{ steps.vars.outputs.run_url }}" \
              "DEPLOYED_BY=github-actions"

      # ADR-005 phase E: analytics, Insider's website tag, Tabby promos and Google Maps
      # come from the backend per address (integrations switchboard), not from this build.
      - name: Remove website settings it no longer reads (switchboard; runtime environment)
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --remove-env-vars \
              NEXT_PUBLIC_INSIDER_ENABLED NEXT_PUBLIC_INSIDER_ACCOUNT_ID NEXT_PUBLIC_INSIDER_SCRIPT_HOST \
              NEXT_PUBLIC_GOOGLE_MAPS_API_KEY NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID \
              NEXT_PUBLIC_GTM_ID NEXT_PUBLIC_GA4_ID \
              NEXT_PUBLIC_TABBY_PUBLIC_KEY NEXT_PUBLIC_TABBY_MERCHANT_CODE \
              NEXT_PUBLIC_ENABLE_TABBY NEXT_PUBLIC_ENABLE_TAMARA NEXT_PUBLIC_ENABLE_PAYMOB \
              NEXT_PUBLIC_APP_ENV NEXT_PUBLIC_DEV_API_BASE_URL NEXT_PUBLIC_DEV_RETURN_URL \
              NEXT_PUBLIC_SEO_INDEXING_ENABLED >/dev/null

      # The backend signs its "refresh this address's settings" calls with this secret
      # (same Key Vault secret as the backend's SITE_REVALIDATE_SECRET). Optional: without
      # it the website refuses those calls and picks up changes within 5 minutes.
      - name: Website refresh secret from Key Vault (optional)
        run: |
          set -euo pipefail
          KV="${{ env.AZURE_KEY_VAULT_NAME }}"
          SECRET=$(az keyvault secret show --vault-name "$KV" --name site-revalidate-secret --query value -o tsv 2>/dev/null || true)
          if [ -z "$SECRET" ]; then
            echo "No site-revalidate-secret in Key Vault: website refresh calls stay off (5-minute refresh applies)"
            exit 0
          fi
          echo "::add-mask::$SECRET"
          az containerapp secret set \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --secrets "site-revalidate-secret=${SECRET}" >/dev/null
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars "SITE_REVALIDATE_SECRET=secretref:site-revalidate-secret" >/dev/null
          echo "Website refresh secret set from Key Vault"

      - name: Get Container App URL and active revision
        id: appurl
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          ACTIVE_REVISION=$(az containerapp revision list \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[?properties.trafficWeight > \`0\`].name | [0]" \
            -o tsv 2>/dev/null || true)

          SERVING_IMAGE=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            -o tsv)

          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "revision=${ACTIVE_REVISION}" >> "$GITHUB_OUTPUT"
          echo "serving_image=${SERVING_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Website URL: https://${FQDN}"

      - name: Smoke test /api/health
        run: |
          URL="https://${{ steps.appurl.outputs.fqdn }}/api/health"
          echo "Testing ${URL}"

          for i in {1..30}; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL" || true)
            cat /tmp/health.json || true
            echo ""

            if [ "$STATUS" = "200" ]; then
              SVC=$(jq -r '.service // .data.service // empty' /tmp/health.json)
              BRAND=$(jq -r '.brand // empty' /tmp/health.json)
              if { [ "$SVC" = "swiss-arabian-website" ] || [ "$SVC" = "swiss-arabian-v2" ]; } && [ "$BRAND" = "${{ matrix.brand }}" ]; then
                echo "Health check passed"
                exit 0
              fi
            fi

            echo "Health returned ${STATUS}, retrying..."
            sleep 10
          done

          echo "Health check failed"
          exit 1

      - name: Verify /api/deployment matches commit
        run: |
          URL="https://${{ steps.appurl.outputs.fqdn }}/api/deployment"
          EXPECTED_SHA="${{ github.sha }}"
          EXPECTED_IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          EXPECTED_BRANCH="${{ github.ref_name }}"

          for i in {1..30}; do
            STATUS=$(curl -s -o /tmp/deployment.json -w "%{http_code}" "$URL" || true)
            cat /tmp/deployment.json || true
            echo ""

            if [ "$STATUS" != "200" ]; then
              sleep 10
              continue
            fi

            ACTUAL_SHA=$(jq -r '.deployment.commitSha // .commitSha // empty' /tmp/deployment.json)
            ACTUAL_IMAGE_TAG=$(jq -r '.deployment.imageTag // .imageTag // empty' /tmp/deployment.json)
            ACTUAL_BRANCH=$(jq -r '.branch // empty' /tmp/deployment.json)

            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] && [ "$ACTUAL_IMAGE_TAG" = "$EXPECTED_IMAGE_TAG" ] && [ "$ACTUAL_BRANCH" = "$EXPECTED_BRANCH" ]; then
              echo "Deployed version matches"
              exit 0
            fi

            sleep 10
          done

          echo "Deployed version does not match expected deployment metadata"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Azure Dev website deployment summary: ${{ matrix.brand }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Image tag | \`${{ steps.vars.outputs.image_tag }}\` |"
            echo "| Full image | \`${{ steps.vars.outputs.image }}\` |"
            echo "| Container App | \`${{ env.AZURE_CONTAINER_APP_WEBSITE }}\` |"
            echo "| FQDN | https://${{ steps.appurl.outputs.fqdn }} |"
            echo "| Backend API | \`${{ env.DEV_API_BASE_URL }}\` |"
            echo "| Workflow | ${{ steps.vars.outputs.run_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
