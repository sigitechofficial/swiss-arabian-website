name: Deploy Azure Dev

on:
  push:
    branches:
      - infra/azure-dev-deployment
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPOSITORY: commerce-website
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-swissarabian-dev' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrswissarabiandev' }}
  AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER || 'acrswissarabiandev.azurecr.io' }}
  AZURE_CONTAINER_APP_WEBSITE: ${{ vars.AZURE_CONTAINER_APP_WEBSITE || 'ca-swissarabian-website-dev' }}
  AZURE_CONTAINER_APPS_ENV: ${{ vars.AZURE_CONTAINER_APPS_ENV || 'cae-swissarabian-dev' }}
  DEV_API_BASE_URL: https://ca-swissarabian-backend-dev.greenbush-d5b07575.uaenorth.azurecontainerapps.io
  DEV_RETURN_URL: https://ca-swissarabian-website-dev.greenbush-d5b07575.uaenorth.azurecontainerapps.io

jobs:
  deploy:
    name: Build and deploy website to Azure dev
    runs-on: ubuntu-latest
    environment: azure-dev

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Secret safety check
        run: |
          set -euo pipefail
          echo "Checking tracked files for accidental secrets..."

          TRACKED_ENV=$(git ls-files -- '.env' '.env.local' '.env.production' '.env.development' '.env.*' 2>/dev/null || true)
          TRACKED_ENV=$(printf '%s\n' "${TRACKED_ENV}" | grep -vE '\.example$' || true)
          if [ -n "${TRACKED_ENV}" ]; then
            echo "ERROR: env files must not be git-tracked:"
            printf '%s\n' "${TRACKED_ENV}"
            exit 1
          fi

          echo "Secret safety check passed"

      - name: Compute image tag
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="dev-${SHORT_SHA}"
          IMAGE="${{ env.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_ENV=dev \
            --build-arg "NEXT_PUBLIC_DEV_API_BASE_URL=${{ env.DEV_API_BASE_URL }}" \
            --build-arg "NEXT_PUBLIC_DEV_RETURN_URL=${{ env.DEV_RETURN_URL }}" \
            --build-arg NEXT_PUBLIC_ENABLE_MFA=false \
            --build-arg NEXT_PUBLIC_ENABLE_PASSWORD_RESET=true \
            --build-arg NEXT_PUBLIC_ENABLE_OAUTH=false \
            --build-arg NEXT_PUBLIC_USE_DEV_SESSION=false \
            -t "${{ steps.vars.outputs.image }}" \
            .

      - name: Login to ACR
        run: |
          az acr login --name "${{ env.AZURE_ACR_NAME }}"

      - name: Push Docker image
        run: |
          docker push "${{ steps.vars.outputs.image }}"

      - name: Ensure Container App exists
        run: |
          set -euo pipefail
          APP="${{ env.AZURE_CONTAINER_APP_WEBSITE }}"
          RG="${{ env.AZURE_RESOURCE_GROUP }}"
          CAE="${{ env.AZURE_CONTAINER_APPS_ENV }}"
          IMAGE="${{ steps.vars.outputs.image }}"
          MI_NAME="${{ vars.AZURE_WEBSITE_UAMI || 'mi-swissarabian-website-dev' }}"

          if ! az identity show --name "$MI_NAME" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Creating user-assigned identity: ${MI_NAME}"
            az identity create --name "$MI_NAME" --resource-group "$RG" --location uaenorth >/dev/null
            PRINCIPAL_ID=$(az identity show --name "$MI_NAME" --resource-group "$RG" --query principalId -o tsv)
            ACR_ID=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query id -o tsv)
            az role assignment create --assignee-object-id "$PRINCIPAL_ID" --assignee-principal-type ServicePrincipal \
              --role AcrPull --scope "$ACR_ID" >/dev/null || true
            sleep 20
          fi

          MI_ID=$(az identity show --name "$MI_NAME" --resource-group "$RG" --query id -o tsv)

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Container App already exists: ${APP}"
            exit 0
          fi

          echo "Creating Container App: ${APP}"
          az containerapp create \
            --name "$APP" \
            --resource-group "$RG" \
            --environment "$CAE" \
            --image "$IMAGE" \
            --target-port 3000 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 2 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --registry-server "${{ env.AZURE_ACR_LOGIN_SERVER }}" \
            --user-assigned "$MI_ID" \
            --registry-identity "$MI_ID"

      - name: Update Container App image and env
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.vars.outputs.image }}" \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 2 \
            --set-env-vars \
              "NODE_ENV=production" \
              "PORT=3000" \
              "HOSTNAME=0.0.0.0" \
              "NEXT_PUBLIC_APP_ENV=dev" \
              "NEXT_PUBLIC_DEV_API_BASE_URL=${{ env.DEV_API_BASE_URL }}" \
              "NEXT_PUBLIC_DEV_RETURN_URL=${{ env.DEV_RETURN_URL }}" \
              "GIT_COMMIT_SHA=${{ github.sha }}" \
              "GIT_SHORT_SHA=${{ steps.vars.outputs.short_sha }}" \
              "GIT_BRANCH=${{ github.ref_name }}" \
              "IMAGE_TAG=${{ steps.vars.outputs.image_tag }}" \
              "FULL_IMAGE=${{ steps.vars.outputs.image }}" \
              "BUILD_TIME=${{ steps.vars.outputs.build_time }}" \
              "GITHUB_RUN_URL=${{ steps.vars.outputs.run_url }}" \
              "DEPLOYED_BY=github-actions"

      - name: Get Container App URL and active revision
        id: appurl
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          ACTIVE_REVISION=$(az containerapp revision list \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[?properties.trafficWeight > \`0\`].name | [0]" \
            -o tsv 2>/dev/null || true)

          SERVING_IMAGE=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_WEBSITE }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            -o tsv)

          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "revision=${ACTIVE_REVISION}" >> "$GITHUB_OUTPUT"
          echo "serving_image=${SERVING_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Website URL: https://${FQDN}"

      - name: Smoke test /api/health
        run: |
          URL="https://${{ steps.appurl.outputs.fqdn }}/api/health"
          echo "Testing ${URL}"

          for i in {1..30}; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL" || true)
            cat /tmp/health.json || true
            echo ""

            if [ "$STATUS" = "200" ]; then
              SVC=$(jq -r '.service // .data.service // empty' /tmp/health.json)
              if [ "$SVC" = "swiss-arabian-website" ]; then
                echo "Health check passed"
                exit 0
              fi
            fi

            echo "Health returned ${STATUS}, retrying..."
            sleep 10
          done

          echo "Health check failed"
          exit 1

      - name: Verify /api/deployment matches commit
        run: |
          URL="https://${{ steps.appurl.outputs.fqdn }}/api/deployment"
          EXPECTED_SHA="${{ github.sha }}"
          EXPECTED_IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          EXPECTED_BRANCH="${{ github.ref_name }}"

          for i in {1..30}; do
            STATUS=$(curl -s -o /tmp/deployment.json -w "%{http_code}" "$URL" || true)
            cat /tmp/deployment.json || true
            echo ""

            if [ "$STATUS" != "200" ]; then
              sleep 10
              continue
            fi

            ACTUAL_SHA=$(jq -r '.deployment.commitSha // empty' /tmp/deployment.json)
            ACTUAL_IMAGE_TAG=$(jq -r '.deployment.imageTag // empty' /tmp/deployment.json)
            ACTUAL_BRANCH=$(jq -r '.branch // empty' /tmp/deployment.json)

            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] && [ "$ACTUAL_IMAGE_TAG" = "$EXPECTED_IMAGE_TAG" ] && [ "$ACTUAL_BRANCH" = "$EXPECTED_BRANCH" ]; then
              echo "Deployed version matches"
              exit 0
            fi

            sleep 10
          done

          echo "Deployed version does not match expected deployment metadata"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Azure Dev website deployment summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Image tag | \`${{ steps.vars.outputs.image_tag }}\` |"
            echo "| Full image | \`${{ steps.vars.outputs.image }}\` |"
            echo "| Container App | \`${{ env.AZURE_CONTAINER_APP_WEBSITE }}\` |"
            echo "| FQDN | https://${{ steps.appurl.outputs.fqdn }} |"
            echo "| Backend API | \`${{ env.DEV_API_BASE_URL }}\` |"
            echo "| Workflow | ${{ steps.vars.outputs.run_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
